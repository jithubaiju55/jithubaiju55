<svg xmlns="http://www.w3.org/2000/svg" width="900" height="258" viewBox="0 0 900 258" fill="none" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><filter id="gw" x="-200%" y="-200%" width="500%" height="500%"><feGaussianBlur stdDeviation="1.6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><style>.s{font-family:'Inter','SF Pro Display','Segoe UI',Helvetica,Arial,sans-serif}.m{font-family:'JetBrains Mono','SF Mono','Fira Code',ui-monospace,Menlo,Consolas,monospace}.f{opacity:0;animation:in .7s cubic-bezier(.2,.8,.2,1) forwards}@keyframes in{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}@keyframes pulse{0%{transform:scale(.85);opacity:.9}70%,100%{transform:scale(2.6);opacity:0}}@keyframes blink{50%{opacity:.35}}</style><rect x=".5" y=".5" width="899" height="257" rx="8" fill="#08090b" stroke="#20242f"/><text x="24" y="34" class="m" font-size="10" letter-spacing="2.5" fill="#22e07a">CHANGELOG</text><text x="876" y="34" text-anchor="end" class="m" font-size="10" fill="#7d8494">real repository history</text><line x1="98" y1="56" x2="98" y2="234" stroke="#20242f"/><g class="f" style="animation-delay:0.0s"><text x="24" y="71.0" class="m" font-size="11" font-weight="700" fill="#f2f4f8">2024</text><text x="24" y="85.0" class="m" font-size="9.5" fill="#7d8494">Q4</text><circle cx="98" cy="66.0" r="4.5" fill="#08090b" stroke="#7d8494" stroke-width="2"/><circle cx="98" cy="66.0" r="2" fill="#7d8494" filter="url(#gw)"/><text x="120" y="70.0" class="s" font-size="15" font-weight="700" fill="#f2f4f8">Shipped first dev tools</text><text x="120" y="89.0" class="s" font-size="12" fill="#9aa0ab">Code editor, calculator, JSON validator, auto-commenter — learning by building small, sharp utilities.</text></g><g class="f" style="animation-delay:0.12s"><text x="24" y="118.0" class="m" font-size="11" font-weight="700" fill="#f2f4f8">2025</text><text x="24" y="132.0" class="m" font-size="9.5" fill="#7d8494">Q3–Q4</text><circle cx="98" cy="113.0" r="4.5" fill="#08090b" stroke="#3b9dff" stroke-width="2"/><circle cx="98" cy="113.0" r="2" fill="#3b9dff" filter="url(#gw)"/><text x="120" y="117.0" class="s" font-size="15" font-weight="700" fill="#f2f4f8">Moved into machine learning</text><text x="120" y="136.0" class="s" font-size="12" fill="#9aa0ab">Classification and prediction projects: attrition, student performance, road-damage detection.</text></g><g class="f" style="animation-delay:0.24s"><text x="24" y="165.0" class="m" font-size="11" font-weight="700" fill="#f2f4f8">2026</text><text x="24" y="179.0" class="m" font-size="9.5" fill="#7d8494">Q1–Q2</text><circle cx="98" cy="160.0" r="4.5" fill="#08090b" stroke="#a78bff" stroke-width="2"/><circle cx="98" cy="160.0" r="2" fill="#a78bff" filter="url(#gw)"/><text x="120" y="164.0" class="s" font-size="15" font-weight="700" fill="#f2f4f8">Started building agents</text><text x="120" y="183.0" class="s" font-size="12" fill="#9aa0ab">ClinicalAgent, AI-Researcher, an RL environment for SQL repair, and a swarm fuzzer that evolves its own strategy.</text></g><g class="f" style="animation-delay:0.36s"><text x="24" y="212.0" class="m" font-size="11" font-weight="700" fill="#f2f4f8">2026</text><text x="24" y="226.0" class="m" font-size="9.5" fill="#7d8494">Q3</text><circle cx="98" cy="207.0" r="4.5" fill="#08090b" stroke="#22e07a" stroke-width="2"/><circle cx="98" cy="207.0" r="2" fill="#22e07a" filter="url(#gw)"/><text x="120" y="211.0" class="s" font-size="15" font-weight="700" fill="#f2f4f8">Shipped to PyPI</text><text x="120" y="230.0" class="s" font-size="12" fill="#9aa0ab">lazyload and pytrace-live — developer tools published for anyone to install.</text></g></svg>